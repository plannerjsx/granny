addEventListener('keydown',e=>{keys[e.code]=1;if(over||!started)return;

 if(e.code=='KeyG'&&P.inv[P.sel]&&!P.hide){spawn(P.inv.splice(P.sel,1)[0],P.l,P.x,P.z);noise(P.x,P.z,P.l,10);snd('thud',null);hud()}
 if(e.code=='KeyF')fl.intensity=fl.intensity?0:1.6;
 if(/^Digit[1-4]$/.test(e.code)){P.sel=+e.code[5]-1;hud()}});
addEventListener('keyup',e=>keys[e.code]=0);
addEventListener('mousedown',()=>drag=1);addEventListener('mouseup',()=>drag=0);
addEventListener('mousemove',e=>{if(started&&(document.pointerLockElement||drag)){P.ry-=e.movementX*.0022;P.rx=Math.max(-1.4,Math.min(1.4,P.rx-e.movementY*.0022))}});
$('go').onclick=()=>{try{AC.resume()}catch(e){}started=1;$('ov').style.display='none';try{const p=ren.domElement.requestPointerLock();if(p&&p.catch)p.catch(()=>{})}catch(e){}};
let wasLocked=0;document.addEventListener('pointerlockchange',()=>{const k=document.pointerLockElement;if(k)wasLocked=1;else if(wasLocked&&!over){wasLocked=0;started=0;$('ov').style.display='flex';$('go').textContent='계속'}});
/* ---------- 게임 루프 ---------- */
function caught(){if(P.imm>0)return;P.imm=3;snd('scream',null);$('fade').style.opacity=1;P.day++;
 setTimeout(()=>{if(P.day>5)return end('💀 5일이 지났다... 탈출 실패');P.l=0;P.x=4;P.z=12.5;P.hide=null;$('vg').style.opacity=.7;
  Object.assign(G,{l:0,x:20,z:3,state:'pat',dest:null,wait:3});$('fade').style.opacity=0;dayHud();msg('눈을 떠 보니 침실이다...')},1300)}
const lampsP=[[4,3,0],[12,3,0],[20,3,0],[4,7.5,0],[12,7.5,0],[20,7.5,0],[4,12.5,0],[12,11,0],[20,12.5,0],[8,7.5,1],[18,12.5,1],[18,7.5,1]];
let beat=0,clk=new T.Clock();
function upd(dt){
 const f=(keys.KeyW?1:0)-(keys.KeyS?1:0),s=(keys.KeyD?1:0)-(keys.KeyA?1:0),mvg=(f||s)&&!P.hide&&P.imm<=0;P.crouch=!!(keys.KeyC||keys.ControlLeft);P.imm-=dt;P.cd-=dt;nzv=Math.max(0,nzv-dt*8);
 if(mvg){let spd=P.crouch?1.5:3;const run=keys.ShiftLeft&&!P.crouch&&P.st>0;if(run){spd=5;P.st-=dt}
  const n=Math.hypot(f,s),sy=Math.sin(P.ry),cy=Math.cos(P.ry);move(P,(-sy*f+cy*s)/n*spd*dt,(-cy*f-sy*s)/n*spd*dt,P.l);P.d+=spd*dt;
  if(P.d>(run?1.4:1.9)){P.d=0;snd('step',null,run?.9:.5);noise(P.x,P.z,P.l,P.crouch?1.5:run?10:5)}}
 if(!keys.ShiftLeft||!mvg)P.st=Math.min(4,P.st+dt*.7);
 if(!P.hide&&P.cd<=0&&Math.hypot(P.x-1.6,P.z-3.2)<1.3){P.cd=2;P.l^=1;P.x=2.2;P.z=5.6;snd('step',null,1);msg(P.l?'2층':'1층');
  if(P.l){const a=$('fade');a.style.transition='none';a.style.opacity=1;setTimeout(()=>{a.style.transition='opacity .5s';a.style.opacity=0},60)}}
 // 상호작용 대상
 let cur=null,bd=9;(P.hide?[P.hide]:O).forEach(o=>{if(o.l!=P.l)return;const d=Math.hypot(o.x-P.x,o.z-P.z);if(d<o.r&&d<bd){bd=d;cur=o}});CUR=cur;$('pr').textContent=cur?cur.lab():'';
 // 할머니
 const g=G,d=Math.hypot(P.x-g.x,P.z-g.z),same=g.l==P.l;g.walk=0;g.see=0;
 if(same&&d<14&&!P.hide){const a=Math.atan2(P.x-g.x,P.z-g.z),df=Math.atan2(Math.sin(a-g.ry),Math.cos(a-g.ry));g.see=(Math.abs(df)<1.05||d<2.5)&&los(g.l,g.x,g.z,P.x,P.z)&&!(P.crouch&&d>8)}
 if(g.see){g.last={x:P.x,z:P.z,l:P.l};g.lost=0;if(g.state!='chase'){g.state='chase';snd('sting',null)}}
 if(g.state=='pat'){g.hum-=dt;if(g.hum<0){g.hum=7+Math.random()*6;snd('hum',g)}
  if(g.wait>0)g.wait-=dt;else{if(!g.dest)g.dest=N[Math.random()*N.length|0];if(steer(g,g.dest.x,g.dest.z,g.dest.l,1.9,dt)){g.dest=null;g.wait=1+Math.random()*3}}}
 else if(g.state=='inv'){if(steer(g,g.tg.x,g.tg.z,g.tg.l,2.8,dt)){g.t+=dt;if(g.t>3){g.state='pat';g.dest=null}}}
 else if(g.state=='chase'){if(!g.see)g.lost+=dt;const T2=g.see?P:g.last;steer(g,T2.x,T2.z,T2.l,4.3,dt);
  if(g.lost>3||(P.hide&&d>2.5)){g.state='sea';g.t=0;g.t2=0}if(d<1.1&&same&&!P.hide)caught()}
 else if(g.state=='sea'){if(steer(g,g.last.x,g.last.z,g.last.l,2.4,dt)){g.t+=dt;g.ry+=dt*2;if(g.t>5){g.state='pat';g.dest=null}}
  if(P.hide&&same&&d<2){g.t2+=dt;if(g.t2>1.5)caught()}else g.t2=0}
 if(g.state=='chase'){beat-=dt;if(beat<0){beat=Math.max(.35,d/18);snd('beat',null,1)}}
 const m=g.mesh,w=Math.sin(performance.now()/(g.state=='chase'?90:220))*(g.walk?.6:0);m.position.set(g.x,g.l*LH,g.z);m.rotation.y=g.ry;g.mesh.legL.rotation.x=w;g.mesh.legR.rotation.x=-w;
 // 까마귀
 crow.children[1].position.y=.15+Math.sin(performance.now()/300)*.03;
 if(P.l==1&&!P.crowFed&&Math.hypot(P.x-22,P.z-15)<9){crowT-=dt;if(crowT<0){crowT=7+Math.random()*6;snd('caw',{x:22,z:15,l:1});noise(22,15,1,13);msg('까악! 까마귀 소리가 퍼졌다')}}
 else if(P.crowFed)crow.visible=true;
 O.forEach(o=>{if(o.m)o.m.rotation.y+=dt});
 // 카메라/조명
 const by=Math.sin(P.d*3.3)*.03;cam.position.set(P.x,P.l*LH+(P.hide?1:P.crouch?1.1:1.65)+by,P.z);cam.rotation.set(P.rx,P.ry,0);
 const L=AC.listener;if(L.positionX){L.positionX.value=P.x;L.positionY.value=P.l*LH+1.6;L.positionZ.value=P.z;L.forwardX.value=-Math.sin(P.ry);L.forwardY.value=0;L.forwardZ.value=-Math.cos(P.ry);L.upX.value=0;L.upY.value=1;L.upZ.value=0}
 const ls=lampsP.filter(q=>q[2]==P.l).sort((a,b)=>Math.hypot(a[0]-P.x,a[1]-P.z)-Math.hypot(b[0]-P.x,b[1]-P.z));
 pls.forEach((p,i)=>{const q=ls[i];if(q){p.position.set(q[0],P.l*LH+2.7,q[1]);p.intensity=.8+(Math.random()<.02?-.5:0)}else p.intensity=0});
 $('nzb').style.width=Math.min(100,nzv*8)+'%';
}
hud();dayHud();msg('할머니의 집에서 탈출하세요. 방에서 쪽지를 찾아보세요.');
(function loop(){requestAnimationFrame(loop);const dt=Math.min(.05,clk.getDelta());if(started&&!over)upd(dt);ren.render(sc,cam)})();
</script></body></html>
